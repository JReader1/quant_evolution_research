[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-evolution-research"
version = "0.1.0"
description = "Evolutionary research on sector-balanced equity momentum strategies"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "yfinance",
    "scipy",
    "scikit-learn",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "jupyter"]

[tool.setuptools.packages.find]
where = ["src"]
